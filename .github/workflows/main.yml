name: CI Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  version:
    runs-on: windows-latest
    outputs:
      release-version: ${{ steps.get-version.outputs.RELEASE_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Version extraction
        id: get-version
        run: |
          $xml1 = [xml](Get-Content -Path Platform/fo-dicom/fo-dicom.Codecs.csproj)
          $version1 = $xml1.Project.PropertyGroup.Version;
          echo "RELEASE_VERSION=$version1" >> $env:GITHUB_OUTPUT          
        shell: pwsh

  build_win_x64:
    runs-on: windows-2022
    needs: version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2
      - name: Compile Dicom.Native for windows x64
        run: msbuild Native/Windows64/build_x64/Dicom.Native.vcxproj /p:Configuration=Release /p:Platform=x64
      - name: Publish windows x64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lib-win-x64
          path: Native/Windows64/build_x64/bin/x64/Release/Dicom.Native
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Prepare SN Key
        run: |
          echo "${{ secrets.STRONG_NAME_KEY }}" >Platform/fo-dicom/fo-dicom.Codecs.snk.base64
          certutil -decode Platform/fo-dicom/fo-dicom.Codecs.snk.base64 Platform/fo-dicom/fo-dicom.Codecs.snk
      - name: Run unit tests
        run: dotnet test Tests/Unit/UnitTests.csproj --logger:trx
  build_win_arm64:
    runs-on: windows-2022
    needs: build_win_x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2
      - name: Compile Dicom.Native for windows arm64
        run: msbuild Native/Windows64/build_arm64/Dicom.Native.vcxproj /p:Configuration=Release /p:Platform=ARM64
      - name: Publish windows ARM64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lib-win-arm64
          path: Native/Windows64/build_arm64/bin/ARM64/Release/Dicom.Native
  build_linux_x64:
    runs-on: ubuntu-22.04
    needs: build_win_x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compile Dicom.Native for linux x64 
        run: |
          cd Native/POSIX64/
          cmake ./CMakeLists.txt
          make
      - name: Publish linux x64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lib-linux-x64
          path: Native/POSIX64/lib-linux-x64
      - name: Prepare SN key
        run: echo ${{ secrets.STRONG_NAME_KEY }} | base64 --decode >Platform/fo-dicom/fo-dicom.Codecs.snk
      - name: Publish managed library
        run: dotnet publish Platform/fo-dicom/fo-dicom.Codecs.csproj --configuration Release
      - name: Publish managed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lib-managed
          path: Platform/fo-dicom/bin/Release/netstandard2.0
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Run unit tests
        run: dotnet test Tests/Unit/*.csproj --logger:trx      

  build_linux_arm64:
    runs-on: ubuntu-22.04
    needs: build_win_x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compile Dicom.Native for linux arm64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cd Native/POSIX64/
          cmake -DARCH_FLAG:STRING=arm64 ./CMakeLists.txt
          make
      - name: Publish linux arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lib-linux-arm64
          path: Native/POSIX64/lib-linux-arm64
        
  build_osx_x64:
    runs-on: macos-14
    needs: build_win_x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compile Dicom.Native for macOS x64
        run: |
          cd Native/POSIX64/
          cmake ./CMakeLists.txt
          make
      - name: Publish osx x64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lib-osx-x64
          path: Native/POSIX64/lib-osx-x64
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Prepare SN key
        run: echo ${{ secrets.STRONG_NAME_KEY }} | base64 --decode >Platform/fo-dicom/fo-dicom.Codecs.snk
      - name: Run unit tests
        run: dotnet test Tests/Unit/*.csproj --logger:trx

  build_osx_arm64:
    runs-on: macos-14
    needs: build_win_x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compile Dicom.Native for macOS arm64
        run: |
          cd Native/POSIX64/
          cmake -DARCH_FLAG:STRING=arm64 ./CMakeLists.txt
          make
      - name: Publish osx arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lib-osx-arm64
          path: Native/POSIX64/lib-osx-arm64
        
  acceptance:
    runs-on: windows-latest
    needs:
      - version
      - build_win_x64
      - build_linux_x64
      - build_linux_arm64
      - build_osx_x64
      - build_osx_arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: bin/lib-win-x64
          name: lib-win-x64
      - name: Prepare SN Key
        run: |
          echo "${{ secrets.STRONG_NAME_KEY }}" >Platform/fo-dicom/fo-dicom.Codecs.snk.base64
          certutil -decode Platform/fo-dicom/fo-dicom.Codecs.snk.base64 Platform/fo-dicom/fo-dicom.Codecs.snk
      - name: Run acceptance tests
        run: |        
          echo "Running Acceptance Test for version ${{ needs.version.outputs.release-version }}..." 
          dotnet test Tests/Acceptance/AcceptanceTests.csproj --logger:trx
      - name: Compress results
        run: Compress-Archive Tests/Acceptance/bin/debug/net8.0/out ./AcceptanceTestResults.zip
        shell: pwsh
      - name: Archive files
        uses: actions/upload-artifact@v7
        with:
          name: test
          path: ./AcceptanceTestResults.zip

  check-paths:
    runs-on: windows-latest
    needs: 
      - acceptance
    outputs:
      only-tests: ${{ steps.check.outputs.only-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check if only Tests folder changed
        id: check
        shell: bash
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "Changed files:"
          echo "$CHANGED"
          ONLY_TESTS=true
          for file in $CHANGED; do
            if [[ ! "$file" =~ ^Tests/ ]]; then
              ONLY_TESTS=false
              break
            fi
          done
          echo "only-tests=$ONLY_TESTS" >> $GITHUB_OUTPUT
          
  nuget:
    runs-on: windows-latest
    needs: 
      - version
      - acceptance
      - check-paths
    if: needs.check-paths.outputs.only-tests != 'true'
    permissions:
      id-token: write # Required for NuGet Trusted Publisher (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: bin
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.x'
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Prepare NuGet package
        run: nuget pack Setup/fo-dicom.Codecs.nuspec -Version ${{needs.version.outputs.release-version}} -Suffix alpha3
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Efferent
      - name: Publish NuGet package
        run: dotnet nuget push "fo-dicom.Codecs.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  release:
    runs-on: ubuntu-latest
    needs: 
      - version
      - acceptance
      - nuget
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: bin
          pattern: test

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.release-version }}" \
            --title "Release ${{ needs.version.outputs.release-version }}" \
            --prerelease

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}        
        run: gh release upload ${{ needs.version.outputs.release-version }} bin/test/AcceptanceTestResults.zip
